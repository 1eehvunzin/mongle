name: iOS build (local, no EAS cloud quota)

# EAS's cloud iOS build quota (Free plan) is exhausted for the month, so this
# runs the actual Xcode build on GitHub's own macOS runner instead — only
# Apple credential lookup goes through EAS (via EXPO_TOKEN), the compile
# itself doesn't touch EAS's build queue/quota at all.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install CocoaPods & fastlane
        run: |
          gem install cocoapods -N
          gem install fastlane -N

      - name: EAS build (local)
        run: npx eas-cli build --platform ios --profile production --local --non-interactive --output ./build.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mongle-ios-build
          path: frontend/build.ipa
          retention-days: 14

      - name: Submit to TestFlight
        run: npx eas-cli submit --platform ios --profile production --path ./build.ipa --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
