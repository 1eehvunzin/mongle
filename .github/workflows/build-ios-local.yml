name: iOS build (local, no EAS cloud quota)

# EAS's cloud iOS build quota (Free plan) is exhausted for the month, so this
# runs the actual Xcode build on GitHub's own macOS runner instead — only
# Apple credential lookup goes through EAS (via EXPO_TOKEN), the compile
# itself doesn't touch EAS's build queue/quota at all.
on:
  workflow_dispatch: {}

jobs:
  build:
    # macos-15's own "latest" Xcode currently lands in the Swift 6.2.x
    # range, which rejects a SWIFT_RETURNS_RETAINED annotation on
    # RuntimeScheduler's constructors in expo-modules-jsi (SDK 57) —
    # "'RuntimeScheduler' cannot be annotated with ... because it is not
    # returning a SWIFT_SHARED_REFERENCE type". The annotation is harmless
    # (upstream's own fix just drops it: expo/expo#49740, not yet
    # released as of SDK 58), but Xcode 26.5+ (Swift 6.3.x) — the default
    # on macos-26 — compiles the header as written, so moving the runner
    # here is the fix rather than fighting Swift's version on macos-15.
    runs-on: macos-26
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # This runner image ships several Xcode versions side by side, and
      # the one xcode-select defaults to isn't necessarily the newest —
      # Apple rejects App Store Connect uploads built with anything older
      # than its current minimum Xcode/iOS SDK, which is what was actually
      # failing at submit time before this step existed. Pinning to the
      # newest available Xcode here (rather than a hardcoded version,
      # which will itself go stale) is what eas build --local invokes
      # under the hood.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install CocoaPods & fastlane
        run: |
          gem install cocoapods -N
          gem install fastlane -N

      - name: EAS build (local)
        run: npx eas-cli build --platform ios --profile production --local --non-interactive --output ./build.ipa
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: mongle-ios-build
          path: frontend/build.ipa
          retention-days: 14

      # TestFlight submit is intentionally NOT automated here — Apple's
      # processing step for a submission can surface real (not just
      # interactive-prompt) errors that need a person to see and react to,
      # e.g. the Xcode/SDK-too-old rejection this workflow used to hit
      # before the Xcode step above was added. Download the mongle-ios-build
      # artifact from this run instead and submit locally:
      #   cd frontend && npx eas-cli submit --platform ios --profile production --path ./build.ipa
